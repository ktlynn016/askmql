<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASKMQL — Sign In</title>
<link rel="stylesheet" href="css/tokens/colors.css">
<link rel="stylesheet" href="css/tokens/typography.css">
<link rel="stylesheet" href="css/tokens/spacing.css">
<link rel="stylesheet" href="css/base/reset.css">
<link rel="stylesheet" href="css/base/base.css">
<link rel="stylesheet" href="css/layouts/page.css">
<link rel="stylesheet" href="css/components/buttons.css">
<link rel="stylesheet" href="css/components/forms.css">
<link rel="stylesheet" href="css/themes/light.css">
<link rel="stylesheet" href="css/themes/dark.css">
<style>
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg);}
  .auth-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:28px 26px; box-shadow:var(--shadow);}
  .auth-brand{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .auth-brand .brand-mark{width:36px; height:36px; border-radius:10px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .auth-brand strong{font-family:var(--font-display); font-size:15px;}
  .auth-tabs{display:flex; gap:6px; background:var(--bg); border-radius:12px; padding:4px; margin-bottom:20px;}
  .auth-tab{flex:1; text-align:center; padding:9px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; border:none; background:none; color:var(--muted);}
  .auth-tab.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px;}
  .field input{width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line); font-size:14px; background:var(--bg); color:var(--ink);}
  .field input:focus{outline:none; border-color:var(--secondary); box-shadow:0 0 0 3px var(--accent);}
  .auth-error{background:var(--unavailable-bg); color:var(--unavailable); font-size:12.5px; padding:9px 12px; border-radius:10px; margin-bottom:14px; display:none;}
  .auth-submit{width:100%; margin-top:4px;}
  .auth-switch{text-align:center; font-size:12.5px; color:var(--muted); margin-top:16px;}
  .auth-switch a, .auth-guest{color:var(--primary); font-weight:600; text-decoration:none; cursor:pointer; background:none; border:none; font-size:inherit;}
  .auth-hint{font-size:11.5px; color:var(--muted); margin-top:18px; text-align:center; line-height:1.5;}
  .form-view{display:none;}
  .form-view.active{display:block;}
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark" data-icon="book-bookmark"></div>
      <strong>ASKMQL</strong>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-role="student">Student</button>
      <button class="auth-tab" data-role="librarian">Librarian</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <!-- Student: login -->
    <form class="form-view active" id="studentLoginForm" data-view="student-login">
      <div class="field"><label>Student ID</label><input type="text" id="studentIdInput" placeholder="2023-0114" required></div>
      <div class="field"><label>Password</label><input type="password" id="studentPasswordInput" required></div>
      <button type="submit" class="btn-primary auth-submit">Sign In</button>
      <div class="auth-switch">No account yet? <a id="showSignup">Sign up</a></div>
    </form>

    <!-- Student: signup -->
    <form class="form-view" id="studentSignupForm" data-view="student-signup">
      <div class="field"><label>Full Name</label><input type="text" id="signupName" required></div>
      <div class="field"><label>Student ID</label><input type="text" id="signupStudentId" placeholder="2023-0114" required></div>
      <div class="field"><label>Department</label><input type="text" id="signupDepartment" placeholder="BSIT"></div>
      <div class="field"><label>Password</label><input type="password" id="signupPassword" placeholder="At least 8 characters" required></div>
      <button type="submit" class="btn-primary auth-submit">Create Account</button>
      <div class="auth-switch">Already have an account? <a id="showLogin">Sign in</a></div>
    </form>

    <!-- Librarian: login -->
    <form class="form-view" id="librarianLoginForm" data-view="librarian-login">
      <div class="field"><label>Email</label><input type="email" id="librarianEmailInput" placeholder="librarian@gsu-mosqueda.edu.ph" required></div>
      <div class="field"><label>Password</label><input type="password" id="librarianPasswordInput" required></div>
      <button type="submit" class="btn-primary auth-submit">Sign In</button>
      <div class="auth-switch">Librarian accounts are provisioned by the library — contact an admin for access.</div>
    </form>

    <div style="text-align:center; margin-top:14px;">
      <button type="button" class="auth-guest" id="continueGuest">Continue as guest →</button>
    </div>

    <div class="auth-hint" id="modeHint"></div>
  </div>
</div>

<script src="js/core/constants.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/state/catalog-data.js"></script>
<script src="js/state/demo-users.js"></script>
<script src="js/state/store.js"></script>
<script src="js/api/client.js"></script>
<script src="js/api/auth.js"></script>
<script>
(function () {
  var icons = ASKMQL.core.icons;
  icons.injectIconSprite();
  document.querySelectorAll("[data-icon]").forEach(function (el) {
    el.innerHTML = icons.icon(el.getAttribute("data-icon"));
  });

  var modeHint = document.getElementById("modeHint");
  modeHint.textContent = ASKMQL.core.constants.USE_API
    ? "Signed in here stays signed in across the app (real session)."
    : "Running fully offline: demo student = 2023-0114 / student123, demo librarian = librarian@gsu-mosqueda.edu.ph / librarian123. Login only lasts for this page in offline mode.";

  var currentRole = "student";
  var currentView = "student-login";
  var errorBox = document.getElementById("authError");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = msg ? "block" : "none";
  }

  function setView(view) {
    currentView = view;
    document.querySelectorAll(".form-view").forEach(function (f) {
      f.classList.toggle("active", f.getAttribute("data-view") === view);
    });
    showError("");
  }

  document.querySelectorAll(".auth-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".auth-tab").forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      currentRole = tab.getAttribute("data-role");
      setView(currentRole === "student" ? "student-login" : "librarian-login");
    });
  });

  document.getElementById("showSignup").addEventListener("click", function (e) { e.preventDefault(); setView("student-signup"); });
  document.getElementById("showLogin").addEventListener("click", function (e) { e.preventDefault(); setView("student-login"); });

  function goToApp(user) {
    window.location.href = user.role === "librarian" ? "admin/index.html" : "chat.html";
  }

  document.getElementById("studentLoginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    showError("");
    ASKMQL.api.auth.login(
      document.getElementById("studentIdInput").value.trim(),
      document.getElementById("studentPasswordInput").value,
      "student"
    ).then(goToApp).catch(function (err) { showError(err.message); });
  });

  document.getElementById("librarianLoginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    showError("");
    ASKMQL.api.auth.login(
      document.getElementById("librarianEmailInput").value.trim(),
      document.getElementById("librarianPasswordInput").value,
      "librarian"
    ).then(goToApp).catch(function (err) { showError(err.message); });
  });

  document.getElementById("studentSignupForm").addEventListener("submit", function (e) {
    e.preventDefault();
    showError("");
    ASKMQL.api.auth.signupStudent({
      name: document.getElementById("signupName").value.trim(),
      student_id: document.getElementById("signupStudentId").value.trim(),
      department: document.getElementById("signupDepartment").value.trim(),
      password: document.getElementById("signupPassword").value
    }).then(goToApp).catch(function (err) { showError(err.message); });
  });

  document.getElementById("continueGuest").addEventListener("click", function () {
    window.location.href = "chat.html";
  });
})();
</script>
</body>
</html>
