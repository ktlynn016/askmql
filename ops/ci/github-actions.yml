# CI workflow. Save as .github/workflows/ci.yml at the repo root to
# activate on GitHub -- kept here under ops/ci/ alongside the rest of
# the deployment tooling so it's easy to find.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: askmql
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Load schema and seed data
        run: |
          mysql -h127.0.0.1 -uroot -prootpass < migrations/0001_initial_schema.sql
          mysql -h127.0.0.1 -uroot -prootpass < migrations/0002_add_feedback_and_query_log.sql
          mysql -h127.0.0.1 -uroot -prootpass < migrations/0003_add_auth.sql
          mysql -h127.0.0.1 -uroot -prootpass askmql < seeds/sample_catalog.sql
          mysql -h127.0.0.1 -uroot -prootpass askmql < seeds/announcements.sql
          mysql -h127.0.0.1 -uroot -prootpass askmql < seeds/users.sql

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: askmql
        run: pytest tests/

      - name: Run retrieval eval
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: askmql
        run: python -m eval.run_eval
